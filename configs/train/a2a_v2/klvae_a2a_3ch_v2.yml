# A2A KL-VAE 配置（3通道）- V2 Pipeline
model:
  model_arch: klvae
  model_config:
    in_channels: 3
    out_channels: 3
    down_block_types: ['DownEncoderBlock2D', 'DownEncoderBlock2D', 'DownEncoderBlock2D', 'DownEncoderBlock2D']
    up_block_types: ['UpDecoderBlock2D', 'UpDecoderBlock2D', 'UpDecoderBlock2D', 'UpDecoderBlock2D']
    block_out_channels: [128, 256, 512, 512]
    layers_per_block: 2
    act_fn: silu
    latent_channels: 4
    norm_num_groups: 32
    sample_size: 512
    force_upcast: True
    use_quant_conv: True
    use_post_quant_conv: True
    mid_block_add_attention: True
    divisible: 8

datasets:
  datasets_folder: "./datasets_preprocess"
  train_datasets:
    - FLAIR_A2A
  val_datasets:
    - FLAIR_A2A
  test_datasets:
    - FLAIR_A2A
  modality_pairs:
    - [0, 1]
    - [0, 2]
    - [0, 3]
    - [1, 0]
    - [1, 2]
    - [1, 3]
    - [2, 0]
    - [2, 1]
    - [2, 3]
    - [3, 0]
    - [3, 1]
    - [3, 2]

training:
  stage: full
  num_epochs: 300
  num_samples_per_epoch: 4225
  train_batch_size: 4
  gradient_accumulation: 4
  test_batch_size: 4
  num_workers: 4
  val_freq: 50
  train_image_size: [512, 512]
  optimizer:
    name: AdamW
    lr: 6e-5
    weight_decay: 1e-3
    momentum: 0.9
  scheduler:
    name: none
    args:
  loss:
    name: 'klvae'
    config:
      disc_conditional: False
      disc_in_channels: 3
      disc_start: 1000001
      kl_weight: 1.0e-06
      disc_weight: 0.0
      perceptual_weight: 1.0
  mixed_precision: True
