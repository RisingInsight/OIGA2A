model:
  model_arch: sit_v2
  model_config:
    arch: L
    patch_size: 2
    cfg_scale: 1.5
    num_modalities: 4
    num_adapters: 4
    adapter_reduction: 2  # 从4减少到2，增加adapter容量
    cross_attn_layers: [2, 5, 8, 11, 14, 17, 20, 23]  # 从6层增加到8层
    context_dim: 768
    clip_model_name: "ViT-L/14"
    lora_rank: 8  # 从4增加到8，增加LoRA表达能力
    lora_alpha: 8  # 相应调整alpha
    vae_path: ./checkpoints/klvae_a2a/last.ckpt
    vae_config:
      in_channels: 3
      out_channels: 3
      down_block_types: ['DownEncoderBlock2D', 'DownEncoderBlock2D', 'DownEncoderBlock2D', 'DownEncoderBlock2D']
      up_block_types: ['UpDecoderBlock2D', 'UpDecoderBlock2D', 'UpDecoderBlock2D', 'UpDecoderBlock2D']
      block_out_channels: [128, 256, 512, 512]
      layers_per_block: 2
      act_fn: silu
      latent_channels: 4
      norm_num_groups: 32
      sample_size: 512
      force_upcast: True
      use_quant_conv: True
      use_post_quant_conv: True
      mid_block_add_attention: True
    transport_config:
      path_type: Linear
      prediction: velocity
      loss_weight: None
    divisible: 16
    target_normalizer: [1.01356, 1.01670, 0.99277, 1.03784]
    sit_lr: 5e-5  # 从1e-5增加到5e-5
    lora_lr: 1e-4  # 从5e-5增加到1e-4

datasets:
  datasets_folder: "./datasets_preprocess"
  instructions_path: "dataloaders/instructions_a2a_v2.json"
  train_datasets:
    - FLAIR_A2A
  val_datasets:
    - FLAIR_A2A
  test_datasets:
    - FLAIR_A2A
  modality_pairs:
    - [0, 1]
    - [0, 2]
    - [0, 3]
    - [1, 0]
    - [1, 2]
    - [1, 3]
    - [2, 0]
    - [2, 1]
    - [2, 3]
    - [3, 0]
    - [3, 1]
    - [3, 2]

training:
  stage: 2
  num_epochs: 150  # 从100增加到150
  num_samples_per_epoch: 4225
  train_batch_size: 8
  test_batch_size: 4
  num_workers: 4
  gradient_accumulation: 4
  val_freq: 50
  train_image_size: [512, 512]
  load: ./checkpoints/sit_a2a_v2/sit_v2_199.ckpt
  load_type: finetune
  optimizer:
    name: AdamW
    lr: 5e-5  # 从1e-5增加到5e-5
    weight_decay: 0.01
    momentum: 0.9
  scheduler:
    name: cosine  # 从none改为cosine
    args:
      T_max: 150  # 与num_epochs一致
  loss:
    name: 'sit'
    config: None
  mixed_precision: False
  gradient_clip_val: 1.0  # 添加梯度裁剪
  gradient_clip_algorithm: norm